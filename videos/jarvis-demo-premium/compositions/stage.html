<!doctype html>
<html lang="pt-BR">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template id="stage-template">
      <style>
        @font-face { font-family: "Mona Sans"; src: url("assets/fonts/MonaSans-Variable.woff2") format("woff2"); font-weight: 200 900; font-stretch: 75% 125%; }
        @font-face { font-family: "Geist Mono"; src: url("assets/fonts/GeistMono-Variable.woff2") format("woff2"); font-weight: 100 900; }
        #root { position: absolute; inset: 0; overflow: hidden; background: #04080c; }
        #sg-cam { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
        #sg-video { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; object-fit: cover; }
        #sg-src, #sg-screen { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
        #sg-band { position: absolute; left: 0; right: 0; bottom: 0; height: 270px;
          background: linear-gradient(180deg, rgba(4,8,12,0) 0%, rgba(4,8,12,0.45) 12%, rgba(4,8,12,0.85) 24%, rgba(4,8,12,0.97) 36%, #04080c 100%); }
        #sg-vig { position: absolute; inset: 0; background: radial-gradient(1400px 900px at 50% 42%, rgba(4,8,12,0) 60%, rgba(4,8,12,0.38) 100%); }

        /* frases-chave */
        .kb { position: absolute; top: 0; bottom: 0; width: 1000px; opacity: 0; }
        .kb.R { right: 0; background: linear-gradient(270deg, rgba(4,8,12,0.86) 0%, rgba(4,8,12,0.62) 45%, rgba(4,8,12,0) 100%); }
        .kb.L { left: 0; background: linear-gradient(90deg, rgba(4,8,12,0.86) 0%, rgba(4,8,12,0.62) 45%, rgba(4,8,12,0) 100%); }
        .kt { position: absolute; width: 700px; }
        .kt .m { display: block; overflow: hidden; padding-bottom: 0.08em; }
        .kt .ln { display: block; font-family: "Mona Sans", sans-serif; font-stretch: 125%; font-weight: 600; line-height: 1.08;
          letter-spacing: -0.01em; color: #e6f7fd; white-space: nowrap; }
        .kt .k { color: #5cd6f5; } .kt .kr { color: #ec5a61; }
        .kt .rule { width: 110px; height: 2px; background: #5cd6f5; margin-top: 26px; }
        .kt.red .rule { background: #ec5a61; }
        .kp { position: absolute; left: 110px; bottom: 250px; width: 820px; padding: 34px 40px 36px; border-radius: 18px;
          background: rgba(6,14,20,0.92); border: 1.5px solid rgba(92,214,245,0.28); box-shadow: 0 40px 120px rgba(0,0,0,0.5); opacity: 0; }
        .kp .kt { position: relative; width: auto; }

        /* cartões (HUD, resultado) */
        .card { position: absolute; border-radius: 18px; background: rgba(6,14,20,0.9); border: 1.5px solid rgba(92,214,245,0.26);
          box-shadow: 0 40px 120px rgba(0,0,0,0.55), inset 0 1px 0 rgba(230,247,253,0.07); opacity: 0; }
        .card .ttl { font-family: "Geist Mono", monospace; font-weight: 600; font-size: 17px; letter-spacing: 0.28em; color: #5cd6f5; }
        .card .row { display: flex; justify-content: space-between; align-items: baseline; gap: 18px; padding: 11px 0; border-top: 1px solid rgba(24,49,64,0.9); opacity: 0; }
        .card .row .a { font-family: "Geist Mono", monospace; font-weight: 500; font-size: 15px; letter-spacing: 0.16em; color: #8ea7b2; white-space: nowrap; }
        .card .row .b { font-family: "Mona Sans", sans-serif; font-weight: 500; font-size: 27px; color: #e6f7fd; text-align: right; white-space: nowrap; }
        .card .row .b.big { font-size: 40px; font-weight: 600; color: #5cd6f5; font-variant-numeric: tabular-nums; }
        .card .body { margin-top: 16px; font-family: "Mona Sans", sans-serif; font-weight: 500; font-size: 31px; line-height: 1.32; color: #e6f7fd; }
        .card .state { margin-top: 18px; font-family: "Geist Mono", monospace; font-weight: 600; font-size: 16px; letter-spacing: 0.3em; color: #5cd6f5; opacity: 0; }
        .card .state i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: #5cd6f5; margin-right: 12px; vertical-align: 1px; }

        /* callouts e caixas (coordenadas do original) */
        .cn { position: absolute; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%; background: #5cd6f5;
          box-shadow: 0 0 0 6px rgba(92,214,245,0.2), 0 0 22px rgba(92,214,245,0.8); opacity: 0; }
        .cl { position: absolute; padding: 12px 18px 13px; border-radius: 12px; background: rgba(6,14,20,0.93); border: 1.5px solid rgba(92,214,245,0.45); opacity: 0; white-space: nowrap; }
        .cl .a { font-family: "Geist Mono", monospace; font-weight: 600; font-size: 16px; letter-spacing: 0.24em; color: #5cd6f5; }
        .cl .b { margin-top: 4px; font-family: "Mona Sans", sans-serif; font-weight: 500; font-size: 22px; color: #e6f7fd; }
        .bx { position: absolute; border: 2px solid rgba(92,214,245,0.85); border-radius: 6px; background: rgba(92,214,245,0.08); opacity: 0; }
        .bx.big { border-width: 2.5px; background: rgba(4,8,12,0.10); box-shadow: 0 0 0 9999px rgba(4,8,12,0); }
        .bxl { position: absolute; padding: 8px 14px 7px; border-radius: 8px; background: #5cd6f5; color: #04080c; font-family: "Geist Mono", monospace;
          font-weight: 700; font-size: 17px; letter-spacing: 0.16em; white-space: nowrap; opacity: 0; }
        .svgl { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; }
        .ld { fill: none; stroke: #5cd6f5; stroke-width: 2; stroke-linecap: round; }

        /* lembrete fixo */
        .chip { position: absolute; right: 56px; top: 44px; display: flex; align-items: center; gap: 12px; padding: 12px 20px 12px 16px; border-radius: 999px;
          background: rgba(6,14,20,0.9); border: 1.5px solid rgba(92,214,245,0.4); font-family: "Geist Mono", monospace; font-weight: 600; font-size: 16px;
          letter-spacing: 0.2em; color: #e6f7fd; opacity: 0; }
        .chip .dot { width: 10px; height: 10px; border-radius: 50%; background: #5cd6f5; }
        .chip .st { color: #8ea7b2; letter-spacing: 0.16em; }

        /* cartela de capítulo */
        .ch { position: absolute; inset: 0; background: #04080c; opacity: 0; }
        .ch .glow { position: absolute; left: 360px; top: 190px; width: 1200px; height: 700px; border-radius: 50%;
          background: radial-gradient(closest-side, rgba(22,96,124,0.26), rgba(6,19,33,0.4) 60%, rgba(4,8,12,0) 100%); }
        .ch .in { position: absolute; left: 0; right: 0; top: 356px; text-align: center; }
        .ch .n { font-family: "Geist Mono", monospace; font-weight: 500; font-size: 22px; letter-spacing: 0.56em; padding-left: 0.56em; color: #8ea7b2; opacity: 0; }
        .ch .tm { overflow: hidden; margin-top: 22px; padding-bottom: 0.06em; }
        .ch .t { display: inline-block; position: relative; font-family: "Mona Sans", sans-serif; font-stretch: 125%; font-weight: 600; font-size: 128px;
          line-height: 1; letter-spacing: 0.06em; padding-left: 0.06em; text-transform: uppercase; color: #e6f7fd; }
        .ch .sw { position: absolute; inset: 0; opacity: 0; color: transparent; -webkit-background-clip: text; background-clip: text;
          background-image: linear-gradient(105deg, rgba(255,255,255,0) 40%, rgba(255,255,255,0.95) 50%, rgba(255,255,255,0) 60%); background-size: 260% 100%; }
        .ch .rule { width: 160px; height: 2px; margin: 34px auto 0; background: #5cd6f5; }
        .ch .s { margin-top: 30px; font-family: "Mona Sans", sans-serif; font-weight: 300; font-size: 38px; color: #c4dae3; }

        /* diagramas */
        .dg { position: absolute; opacity: 0; }
        .dg .lab { font-family: "Geist Mono", monospace; font-weight: 600; font-size: 16px; letter-spacing: 0.26em; color: #8ea7b2; }
        .dg .hl { font-family: "Mona Sans", sans-serif; font-weight: 600; font-size: 30px; color: #e6f7fd; }
        .st4 { display: flex; align-items: center; gap: 20px; height: 84px; opacity: 0.32; }
        .st4 .num { width: 50px; height: 50px; border-radius: 50%; border: 1.5px solid rgba(142,167,178,0.7); display: flex; align-items: center; justify-content: center;
          font-family: "Geist Mono", monospace; font-weight: 600; font-size: 16px; color: #8ea7b2; flex: none; }
        .st4 .tx { font-family: "Mona Sans", sans-serif; font-stretch: 112%; font-weight: 600; font-size: 34px; color: #e6f7fd; }
        .pill { display: inline-block; padding: 10px 18px 9px; border-radius: 999px; border: 1.5px solid rgba(92,214,245,0.5); background: rgba(92,214,245,0.1);
          font-family: "Mona Sans", sans-serif; font-weight: 500; font-size: 24px; color: #e6f7fd; white-space: nowrap; }
        .pill.red { border-color: rgba(236,90,97,0.6); background: rgba(236,90,97,0.12); }
        .pill.amb { border-color: rgba(242,182,92,0.7); background: rgba(242,182,92,0.13); }
        .vdot { position: absolute; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; background: rgba(142,167,178,0.55); }
        .vlab { position: absolute; font-family: "Mona Sans", sans-serif; font-weight: 500; font-size: 21px; color: #e6f7fd; white-space: nowrap; opacity: 0; }
      </style>
      <div id="root" data-composition-id="stage" data-width="1920" data-height="1080">
        <div id="sg-cam">
          <video id="sg-video" src="assets/source/original.mp4" muted playsinline data-start="0" data-duration="763.85" data-media-start="9.95" data-track-index="0"></video>
          <div id="sg-src"></div>
        </div>
        <div id="sg-vig" data-layout-ignore></div>
        <div id="sg-screen"></div>
        <div id="sg-band" data-layout-ignore></div>
        <div id="sg-cards"></div>
      </div>
      <script>
        (function () {
          gsap.registerPlugin(DrawSVGPlugin);
          const tl = gsap.timeline({ paused: true });
          const J = window.JM;
          const D = window.CUES;
          const T = (s) => s - D.src_in;            // tempo do original → tempo desta composição
          const END = D.src_out - D.src_in;
          const SRC = document.getElementById("sg-src"), SCR = document.getElementById("sg-screen"), CARDS = document.getElementById("sg-cards");
          const el = (tag, cls, parent, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; parent.appendChild(e); return e; };
          const LEN = new Set(["left", "top", "right", "bottom", "width", "height"]);
          const px = (e, o) => { for (const k in o) e.style[k] = typeof o[k] === "number" && LEN.has(k) ? o[k] + "px" : String(o[k]); return e; };
          const fadeIO = (e, a, b, o = {}) => {
            tl.fromTo(e, { opacity: 0, y: o.y || 0, filter: `blur(${o.blur || 6}px)` }, { opacity: 1, y: 0, filter: "blur(0px)", duration: o.din || 0.5, ease: "power3.out" }, a);
            tl.fromTo(e, { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: `blur(${o.blur || 6}px)`, duration: o.dout || 0.4, ease: "power2.in", immediateRender: false }, b - (o.dout || 0.4));
          };
          const cues = D.cues.slice();

          // ------------------------------------------------------------ câmera
          const cam = document.getElementById("sg-cam");
          const clampT = (s, x, y) => {
            let tx = 960 - x * s, ty = 540 - y * s;
            tx = Math.min(0, Math.max(1920 - 1920 * s, tx)); ty = Math.min(0, Math.max(1080 - 1080 * s, ty));
            return { x: tx, y: ty, scale: s };
          };
          let prev = { x: 0, y: 0, scale: 1 };
          gsap.set(cam, prev);
          cues.filter((c) => c.k === "cam").sort((a, b) => a.t - b.t).forEach((c) => {
            const nx = clampT(c.s, c.x, c.y);
            tl.fromTo(cam, { ...prev }, { ...nx, duration: Math.max(0.01, c.d), ease: c.e || "sine.inOut", immediateRender: false }, Math.max(0, T(c.t)));
            prev = nx;
          });

          // ------------------------------------------------------------ faixa de legenda (sai quando o produto mostra algo embaixo)
          const band = document.getElementById("sg-band");
          cues.filter((c) => c.k === "band").forEach((c) => {
            tl.fromTo(band, { opacity: 1 }, { opacity: 0, duration: 0.35, ease: "power2.inOut", immediateRender: false }, T(c.t0));
            tl.fromTo(band, { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power2.inOut", immediateRender: false }, T(c.t1));
          });

          // ------------------------------------------------------------ frases-chave
          const kins = cues.filter((c) => c.k === "kin").sort((a, b) => a.t - b.t);
          kins.forEach((c, i) => {
            const next = kins.slice(i + 1).find((n) => n.pos === c.pos);
            const prev = kins.slice(0, i).reverse().find((p) => p.pos === c.pos);
            const chained = (p, q) => p && q && !p.panel && !q.panel && p.pos !== "LB" && T(q.t) - T(p.t + p.d) < 0.8;
            const cP = chained(prev, c), cN = chained(c, next);
            const a = T(c.t) - 0.12;
            const b = Math.min(T(c.t + c.d), next ? T(next.t) - 0.15 : 1e9);
            const maxc = Math.max(...c.lines.map((l) => l.length));
            const fs = Math.min(64, Math.floor(700 / (maxc * 0.6)));
            const kt = document.createElement("div");
            kt.className = "kt" + (c.red ? " red" : "");
            const lines = c.lines.map((l) => {
              const m = el("span", "m", kt);
              const words = l.split(" ").map((w) => (c.key && w === c.key ? `<span class="${c.red ? "kr" : "k"}">${w}</span>` : w)).join(" ");
              return el("span", "ln", m, words);
            });
            lines.forEach((ln) => (ln.style.fontSize = fs + "px"));
            const rule = el("div", "rule", kt);
            let holder;
            if (c.panel || c.pos === "LB") {
              holder = el("div", "kp", SCR);
              holder.appendChild(kt);
              fadeIO(holder, a, b, { y: 16, blur: 8 });
            } else {
              holder = el("div", "kb " + (c.pos === "L" ? "L" : "R"), SCR);
              holder.setAttribute("data-layout-ignore", "");
              // frases encadeadas no mesmo lado: o fundo não pisca, só o texto troca
              if (cP) tl.set(holder, { opacity: 1 }, a);
              else tl.fromTo(holder, { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, a);
              if (cN) tl.set(holder, { opacity: 0 }, T(next.t) - 0.12);
              else tl.fromTo(holder, { opacity: 1 }, { opacity: 0, duration: 0.45, ease: "power2.in", immediateRender: false }, b - 0.45);
              SCR.appendChild(kt);
              const h = c.lines.length * fs * 1.08 + 28;
              px(kt, { top: 420 - h / 2, left: c.pos === "L" ? 150 : 1190 });
              tl.fromTo(kt, { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power2.in", immediateRender: false }, b - 0.4);
            }
            // fora da janela a frase some de verdade (a máscara esconde o texto, mas o bloco seguiria no layout)
            gsap.set(kt, { autoAlpha: 0 });
            tl.set(kt, { autoAlpha: 1 }, a);
            tl.set(kt, { visibility: "hidden" }, b);
            J.maskReveal(tl, lines, a + 0.05, { dur: 0.8, stagger: 0.1 });
            tl.fromTo(rule, { scaleX: 0, transformOrigin: "left center" }, { scaleX: 1, duration: 0.6, ease: "expo.out" }, a + 0.3);
            if (c.red) {  // o único glitch do filme: ULTRON
              const k = kt.querySelector(".kr");
              if (k) {
                tl.set(k, { textShadow: "6px 0 0 rgba(236,90,97,0.9), -6px 0 0 rgba(92,214,245,0.7)", x: -6 }, a + 0.35);
                tl.set(k, { textShadow: "-4px 0 0 rgba(236,90,97,0.9), 4px 0 0 rgba(92,214,245,0.6)", x: 4 }, a + 0.42);
                tl.set(k, { textShadow: "none", x: 0 }, a + 0.49);
              }
            }
          });

          // ------------------------------------------------------------ cartões HUD e de resultado
          const cardPos = (pos, w) => pos === "L" ? { left: 150, top: 250 } : pos === "TL" ? { left: 120, top: 120 } : { left: 1920 - 150 - w, top: 250 };
          cues.filter((c) => c.k === "hud").forEach((c) => {
            const card = px(el("div", "card", CARDS), { left: c.x, top: c.y, width: c.w, padding: "26px 30px 18px" });
            el("div", "ttl", card, c.title);
            const a = T(c.t), b = T(c.t + c.d);
            fadeIO(card, a, b, { y: 14 });
            c.items.forEach((it, i) => {
              const row = el("div", "row", card);
              if (it[0]) el("span", "a", row, it[0]);
              const v = el("span", "b" + (c.count && c.count.row === i ? " big" : ""), row, it[1]);
              if (!it[0]) row.style.justifyContent = "flex-start";
              J.hudIn(tl, row, T(it[2]) - 0.08, { x: 10, dur: 0.4 });
              if (c.count && c.count.row === i) J.countUp(tl, v, T(it[2]) - 0.05, 0, c.count.to, { dur: 1.1, ease: "power3.out" });
            });
          });
          cues.filter((c) => c.k === "res").forEach((c) => {
            const w = 640;
            const card = px(el("div", "card", CARDS), { ...cardPos(c.pos, w), width: w, padding: "26px 32px 30px" });
            el("div", "ttl", card, c.label);
            const body = el("div", "body", card, c.body);
            const a = T(c.t) - 0.1, b = T(c.t + c.d);
            fadeIO(card, a, b, { y: 14 });
            if (c.typing) {
              const full = c.body; body.textContent = "";
              const p = { n: 0 };
              tl.fromTo(p, { n: 0 }, { n: full.length, duration: Math.max(0.6, (b - a) - 1.6), ease: "none", onUpdate: () => { body.textContent = full.slice(0, Math.round(p.n)); } }, a + 0.2);
            }
            if (c.state) {
              const st = el("div", "state", card, `<i></i>${c.state}`);
              tl.fromTo(st, { opacity: 0 }, { opacity: 1, duration: 0.3 }, b - 1.1);
              tl.fromTo(st.querySelector("i"), { opacity: 1 }, { opacity: 0.2, duration: 0.25, yoyo: true, repeat: 3, ease: "sine.inOut" }, b - 1.0);
            }
          });

          // ------------------------------------------------------------ callouts (sobre a interface, acompanham a câmera)
          cues.filter((c) => c.k === "call").forEach((c) => {
            const a = T(c.t), b = T(c.t + c.d);
            const n = px(el("div", "cn", SRC), { left: c.x, top: c.y });
            const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
            svg.setAttribute("class", "svgl"); svg.setAttribute("viewBox", "0 0 1920 1080"); svg.setAttribute("data-layout-ignore", "");
            const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
            path.setAttribute("class", "ld"); path.setAttribute("d", `M ${c.x} ${c.y} L ${c.lx} ${c.ly}`);
            svg.appendChild(path); SRC.appendChild(svg);
            const lab = px(el("div", "cl", SRC, `<div class="a">${c.label}</div>${c.sub ? `<div class="b">${c.sub}</div>` : ""}`),
              { left: c.lx + (c.lx >= c.x ? 10 : -10), top: c.ly - 10 });
            if (c.lx < c.x) lab.style.transform = "translateX(-100%)";
            tl.fromTo(n, { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2.4)" }, a);
            tl.fromTo(path, { drawSVG: "0%" }, { drawSVG: "100%", duration: 0.4, ease: "power2.out" }, a + 0.1);
            tl.fromTo(lab, { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out" }, a + 0.38);
            tl.fromTo([n, lab, svg], { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.in", immediateRender: false }, b - 0.3);
          });

          // ------------------------------------------------------------ caixas: elementos clicáveis e regiões descritas
          const R = J.rng(2217);
          cues.filter((c) => c.k === "boxes").forEach((c) => {
            const a = T(c.t), b = T(c.t + c.d);
            if (c.grid === "wiki-home") {
              const rects = [[180, 100, 225, 60], [412, 112, 560, 40], [972, 112, 100, 40], [1555, 120, 330, 24], [40, 224, 230, 24], [1195, 224, 310, 24],
                [890, 330, 310, 26], [1100, 380, 260, 22], [1000, 430, 560, 24]];
              const cats = ["Arte", "Biologia", "Ciência", "Filosofia", "Física", "Geografia", "História", "Matemática", "Química"];
              cats.forEach((_, i) => rects.push([88 + i * 158, 536, 120, 22]));
              for (let i = 0; i < 12; i++) rects.push([1745, 300 + i * 46, 130, 24]);
              for (let i = 0; i < 9; i++) rects.push([90 + (i % 3) * 170, 730 + Math.floor(i / 3) * 44, 140 + (i * 37) % 60, 20]);
              for (let i = 0; i < 9; i++) rects.push([930 + (i % 3) * 190, 730 + Math.floor(i / 3) * 44, 150 + (i * 29) % 50, 20]);
              const scan = px(el("div", "", SRC), { position: "absolute", left: 0, top: 0, width: "1920px", height: "3px", background: "#5cd6f5", boxShadow: "0 0 24px #5cd6f5", opacity: 0 });
              tl.fromTo(scan, { opacity: 1, y: 90 }, { y: 900, duration: 1.4, ease: "power1.inOut", immediateRender: false }, a);
              tl.set(scan, { opacity: 0 }, a + 1.4);
              rects.forEach((r, i) => {
                const bx = px(el("div", "bx", SRC), { left: r[0] - 4, top: r[1] - 4, width: r[2] + 8, height: r[3] + 8 });
                const at = a + 0.15 + ((r[1] - 90) / 810) * 1.25 + R() * 0.08;
                tl.fromTo(bx, { opacity: 0, scale: 1.25 }, { opacity: 1, scale: 1, duration: 0.25, ease: "power3.out" }, at);
                tl.fromTo(bx, { opacity: 1 }, { opacity: 0, duration: 0.35, ease: "power2.in", immediateRender: false }, b - 0.35 - (i % 5) * 0.03);
              });
              const tag = px(el("div", "cl", SCR, `<div class="a">TUDO O QUE É CLICÁVEL</div><div class="b">levantado antes do primeiro clique</div>`), { left: 1180, top: 640 });
              fadeIO(tag, a + 1.0, b, { y: 10 });
            } else if (c.grid === "wiki-article") {
