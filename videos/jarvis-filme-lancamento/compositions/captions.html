: 39.28}, {"text": "risco", "start": 39.28, "end": 39.68}, {"text": "definido.", "start": 39.68, "end": 40.298}, {"text": "Uma", "start": 47.68, "end": 47.92}, {"text": "frase,", "start": 47.92, "end": 48.32}, {"text": "e", "start": 48.32, "end": 48.48}, {"text": "ele", "start": 48.48, "end": 48.64}, {"text": "cria", "start": 48.64, "end": 48.96}, {"text": "a", "start": 48.96, "end": 49.04}, {"text": "rotina", "start": 49.04, "end": 49.52}, {"text": "que", "start": 49.52, "end": 49.76}, {"text": "acende", "start": 49.76, "end": 50.24}, {"text": "a", "start": 50.24, "end": 50.4}, {"text": "luz", "start": 50.4, "end": 50.72}, {"text": "quando", "start": 50.72, "end": 50.88}, {"text": "você", "start": 50.88, "end": 51.12}, {"text": "chegar", "start": 51.12, "end": 51.6}, {"text": "em", "start": 51.6, "end": 51.68}, {"text": "casa.", "start": 51.68, "end": 52.03}, {"text": "Com", "start": 54.2, "end": 54.36}, {"text": "o", "start": 54.36, "end": 54.52}, {"text": "Elo,", "start": 54.52, "end": 54.92}, {"text": "o", "start": 54.92, "end": 55.0}, {"text": "celular", "start": 55.0, "end": 55.56}, {"text": "e", "start": 55.56, "end": 55.72}, {"text": "o", "start": 55.72, "end": 55.8}, {"text": "computador", "start": 55.8, "end": 56.36}, {"text": "funcionam", "start": 56.36, "end": 56.92}, {"text": "como", "start": 56.92, "end": 57.08}, {"text": "um", "start": 57.08, "end": 57.24}, {"text": "só.", "start": 57.24, "end": 57.587}, {"text": "Ligue", "start": 58.1, "end": 58.5}, {"text": "a", "start": 58.5, "end": 58.58}, {"text": "máquina", "start": 58.58, "end": 58.9}, {"text": "de", "start": 58.9, "end": 59.06}, {"text": "longe,", "start": 59.06, "end": 59.54}, {"text": "use", "start": 59.54, "end": 59.94}, {"text": "a", "start": 59.94, "end": 60.02}, {"text": "tela", "start": 60.02, "end": 60.26}, {"text": "dela", "start": 60.26, "end": 60.5}, {"text": "no", "start": 60.5, "end": 60.66}, {"text": "celular,", "start": 60.66, "end": 61.14}, {"text": "e", "start": 61.14, "end": 61.38}, {"text": "compartilhe", "start": 61.38, "end": 62.02}, {"text": "arquivos", "start": 62.02, "end": 62.42}, {"text": "e", "start": 62.42, "end": 62.58}, {"text": "memória.", "start": 62.58, "end": 63.091}, {"text": "E", "start": 64.4, "end": 64.64}, {"text": "quando", "start": 64.64, "end": 64.88}, {"text": "falta", "start": 64.88, "end": 65.28}, {"text": "uma", "start": 65.28, "end": 65.44}, {"text": "função,", "start": 65.44, "end": 66.0}, {"text": "ele", "start": 66.0, "end": 66.16}, {"text": "escreve", "start": 66.16, "end": 66.72}, {"text": "a", "start": 66.72, "end": 66.8}, {"text": "própria", "start": 66.8, "end": 67.12}, {"text": "ferramenta.", "start": 67.12, "end": 67.8}, {"text": "Em", "start": 68.6, "end": 68.798}, {"text": "Python.", "start": 68.798, "end": 69.325}, {"text": "Mas", "start": 69.325, "end": 69.588}, {"text": "ela", "start": 69.588, "end": 69.852}, {"text": "só", "start": 69.852, "end": 70.049}, {"text": "passa", "start": 70.049, "end": 70.445}, {"text": "a", "start": 70.445, "end": 70.576}, {"text": "funcionar", "start": 70.576, "end": 71.235}, {"text": "depois", "start": 71.235, "end": 71.696}, {"text": "que", "start": 71.696, "end": 71.96}, {"text": "você", "start": 71.96, "end": 72.289}, {"text": "revisa", "start": 72.289, "end": 72.75}, {"text": "o", "start": 72.75, "end": 72.882}, {"text": "código", "start": 72.882, "end": 73.343}, {"text": "e", "start": 73.343, "end": 73.475}, {"text": "aprova.", "start": 73.475, "end": 74.002}, {"text": "JARVIS", "start": 79.4, "end": 79.96}, {"text": "ou", "start": 79.96, "end": 80.12}, {"text": "ULTRON:", "start": 80.12, "end": 80.76}, {"text": "mesma", "start": 80.76, "end": 81.08}, {"text": "memória,", "start": 81.08, "end": 81.56}, {"text": "mesmas", "start": 81.56, "end": 81.96}, {"text": "ferramentas.", "start": 81.96, "end": 82.838}];
        // Palavras que podem receber o destaque ciano (no máximo uma por frase).
        var KEYWORDS = ["falar", "voz", "funções", "Elo", "memória", "ferramenta", "aprova"];
        // Quebras e frases ocultas (onde a tipografia cinética já diz a mesma coisa).
        var BREAK_AFTER = [];
        var HIDDEN_GROUPS = [];

        (function () {
          const tl = gsap.timeline({ paused: true });
          const layer = document.getElementById("captions-layer");
          const MAX_CHARS = 44, PAUSE = 0.42;
          const norm = (w) => w.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]/g, "");
          const keyset = new Set(KEYWORDS.map(norm));
          // palavras que não fecham uma linha / que abrem uma oração
          const NOEND = new Set(["de", "do", "da", "dos", "das", "a", "o", "as", "os", "e", "em", "no", "na", "com", "um", "uma", "que",
            "por", "para", "à", "ao", "se", "só", "não", "seu", "sua", "depois", "antes", "até", "mas", "ou", "como", "quando"].map(norm));
          const OPENERS = new Set(["que", "quando", "e", "mas", "ou", "porque", "depois", "como"].map(norm));
          const KEEP = [["celular", "android"], ["casa", "inteligente"], ["nivel", "de"], ["de", "risco"]];
          const txt = (ids) => ids.map((k) => TRANSCRIPT[k].text).join(" ");

          // 1) orações: pausa, pontuação forte, vírgula depois de 3+ palavras
          const clauses = [];
          let cur = [];
          TRANSCRIPT.forEach((w, i) => {
            cur.push(i);
            const next = TRANSCRIPT[i + 1];
            const gap = next ? next.start - w.end : 99;
            const hard = /[.!?…:;]$/.test(w.text) || (/,$/.test(w.text) && cur.length >= 3);
            if (!next || hard || gap > PAUSE || BREAK_AFTER.includes(i)) { clauses.push(cur); cur = []; }
          });
          // 2) oração longa: corta no ponto mais natural (equilíbrio + gramática), recursivo
          function split(ids) {
            if (txt(ids).length <= MAX_CHARS || ids.length < 4) return [ids];
            let best = 2, bestCost = Infinity;
            for (let j = 2; j <= ids.length - 2; j++) {
              const A = ids.slice(0, j), B = ids.slice(j);
              const la = txt(A).length, lb = txt(B).length;
              const endRaw = TRANSCRIPT[A[A.length - 1]].text, endW = norm(endRaw), startW = norm(TRANSCRIPT[B[0]].text);
              let cost = Math.abs(la - lb);
              if (/,$/.test(endRaw)) cost -= 25;
              if (NOEND.has(endW)) cost += 30;
              if (OPENERS.has(startW)) cost -= 8;
              if (KEEP.some(([x, y]) => x === endW && y === startW)) cost += 40;
              cost += Math.max(0, la - MAX_CHARS) * 3 + Math.max(0, lb - MAX_CHARS) * 3;
              if (cost < bestCost) { bestCost = cost; best = j; }
            }
            return split(ids.slice(0, best)).concat(split(ids.slice(best)));
          }
          const groups = clauses.flatMap(split);
          const usedKeys = new Set(); // cada palavra de destaque acende uma vez só no filme

          // 2) monta DOM + timeline
          let shadeOn = false, lastEnd = -99;
          groups.forEach((idx, g) => {
            const words = idx.map((k) => TRANSCRIPT[k]);
            const start = words[0].start, end = words[words.length - 1].end;
            const next = groups[g + 1] ? TRANSCRIPT[groups[g + 1][0]].start : end + 2;
            const tIn = Math.max(0, start - 0.08);
            const nextIn = next - 0.08;
            // frases coladas trocam seco (sem duas legendas sobrepostas); com pausa, saem em fade
            const hardSwitch = nextIn - (end + 0.06) < 0.32;
            const tOut = hardSwitch ? nextIn : Math.min(end + 0.32, nextIn - 0.22);
            if (HIDDEN_GROUPS.includes(g)) return;

            const el = document.createElement("div");
            el.className = "caption-group";
            el.id = "cg-" + g;
            let keyUsed = false;
            const spans = words.map((w, j) => {
              const s = document.createElement("span");
              s.className = "caption-word";
              s.textContent = w.text + (j < words.length - 1 ? " " : "");
              const nk = norm(w.text);
              if (!keyUsed && keyset.has(nk) && !usedKeys.has(nk)) { s.classList.add("is-key"); keyUsed = true; usedKeys.add(nk); s.dataset.t = w.start; }
              el.appendChild(s);
              return s;
            });
            layer.appendChild(el);

            // sombra de leitura: acende no primeiro grupo de uma sequência, apaga em pausas longas
            if (!shadeOn || start - lastEnd > 1.6) {
              tl.fromTo("#captions-shade", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "sine.out" }, tIn - 0.1);
              shadeOn = true;
            }
            lastEnd = tOut;
            const gapAfter = groups[g + 1] ? next - tOut : 99;
            if (gapAfter > 1.6) {
              tl.to("#captions-shade", { opacity: 0, duration: 0.6, ease: "sine.in" }, tOut + 0.1);
              shadeOn = false;
            }

            tl.set(el, { opacity: 1, visibility: "visible" }, tIn);
            spans.forEach((s, j) => {
              tl.fromTo(s, { y: 12, opacity: 0, filter: "blur(5px)" },
                { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.36, ease: "power3.out" }, tIn + j * 0.024);
            });
            spans.filter((s) => s.classList.contains("is-key")).forEach((s) => {
              const t = parseFloat(s.dataset.t);
              tl.fromTo(s, { color: "#e6f7fd" }, { color: "#5cd6f5", duration: 0.28, ease: "power2.out" }, Math.max(tIn + 0.1, t - 0.04));
            });
            if (hardSwitch) {
              tl.set(el, { opacity: 0, visibility: "hidden" }, tOut);
            } else {
              tl.to(el, { opacity: 0, y: -6, duration: 0.2, ease: "power2.in" }, tOut);
              tl.set(el, { opacity: 0, visibility: "hidden" }, tOut + 0.2);
            }
          });

          window.__timelines["captions"] = tl;
        })();
      </script>
