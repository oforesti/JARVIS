<!doctype html>
<html lang="pt-BR">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template id="f05-encadeia-template">
      <style>
        @font-face { font-family: "Mona Sans"; src: url("assets/fonts/MonaSans-Variable.woff2") format("woff2"); font-weight: 200 900; font-stretch: 75% 125%; }
        @font-face { font-family: "Geist Mono"; src: url("assets/fonts/GeistMono-Variable.woff2") format("woff2"); font-weight: 100 900; }
        @font-face { font-family: "Orbitron"; src: url("assets/fonts/Orbitron-Variable.woff2") format("woff2"); font-weight: 400 900; }
        #root { position: absolute; inset: 0; overflow: hidden; background: #04080c; }
        #en-bg { position: absolute; inset: 0; }
        #en-glow { position: absolute; left: 260px; top: 40px; width: 1400px; height: 900px; border-radius: 50%;
          background: radial-gradient(closest-side, rgba(47,123,255,0.11), rgba(6,19,33,0.5) 60%, rgba(4,8,12,0) 100%); }
        #en-grid { position: absolute; inset: 0;
          background-image: linear-gradient(rgba(111,133,145,0.07) 1px, transparent 1px), linear-gradient(90deg, rgba(111,133,145,0.07) 1px, transparent 1px);
          background-size: 80px 80px; background-position: 40px 30px;
          -webkit-mask-image: radial-gradient(900px 560px at 50% 45%, #000 0%, transparent 100%);
                  mask-image: radial-gradient(900px 560px at 50% 45%, #000 0%, transparent 100%); }
        #en-world { position: absolute; inset: 0; transform-origin: 960px 460px; }

        /* título: a fala é a tipografia */
        #en-head { position: absolute; left: 0; right: 0; top: 330px; text-align: center; }
        .mask { overflow: hidden; padding: 0 0 0.08em; }
        #en-h1 { font-family: "Mona Sans", sans-serif; font-stretch: 125%; font-weight: 600; font-size: 112px; line-height: 1.05; color: #e6f7fd; letter-spacing: -0.01em; }
        #en-h2 { margin-top: 26px; font-family: "Mona Sans", sans-serif; font-stretch: 110%; font-weight: 300; font-size: 62px; color: #c4dae3; }
        #en-h2 .k { color: #5cd6f5; font-weight: 600; }

        .lab { position: absolute; font-family: "Geist Mono", monospace; font-weight: 500; font-size: 18px; letter-spacing: 0.3em; color: #8ea7b2; white-space: nowrap; }
        .lab i { display: inline-block; width: 28px; height: 1.5px; background: #5cd6f5; vertical-align: middle; margin-right: 14px; font-style: normal; }

        /* painel do pedido */
        .glass { position: absolute; border-radius: 18px; background: rgba(11,24,32,0.86); border: 1.5px solid rgba(92,214,245,0.20);
          box-shadow: 0 40px 120px rgba(0,0,0,0.55), inset 0 1px 0 rgba(230,247,253,0.08); }
        #en-l1 { left: 362px; top: 148px; } #en-l2 { left: 464px; top: 440px; }
        #en-panel { left: 360px; top: 190px; width: 1200px; height: 214px; overflow: hidden; }
        #en-ph { position: absolute; left: 44px; top: 34px; display: flex; align-items: center; gap: 16px; }
        #en-ph svg { width: 26px; height: 26px; }
        #en-state { font-family: "Orbitron", sans-serif; font-weight: 600; font-size: 18px; letter-spacing: 0.34em; color: #5cd6f5; }
        #en-bars { position: absolute; right: 44px; top: 34px; width: 330px; height: 28px; }
        .vb { position: absolute; bottom: 0; width: 4px; height: 28px; border-radius: 2px; background: #5cd6f5; transform-origin: 50% 50%; }
        #en-req { position: absolute; left: 44px; right: 44px; top: 100px; font-family: "Mona Sans", sans-serif; font-weight: 500; font-size: 46px;
          line-height: 1.25; color: #e6f7fd; white-space: nowrap; }
        #en-req .w { display: inline-block; position: relative; }
        #en-req .cw { position: absolute; right: -9px; top: 4px; width: 3px; height: 50px; background: #5cd6f5; opacity: 0; }

        /* cadeia de passos */
        #en-spine { position: absolute; left: 404px; top: 404px; width: 2px; height: 280px; background: linear-gradient(180deg, rgba(92,214,245,0.7), rgba(92,214,245,0.35)); }
        .dot { position: absolute; left: 383px; width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid rgba(111,133,145,0.8); background: #04080c;
          font-family: "Geist Mono", monospace; font-weight: 600; font-size: 16px; color: #8ea7b2; display: flex; align-items: center; justify-content: center; }
        .dot .f { position: absolute; inset: -1.5px; border-radius: 50%; background: #5cd6f5; opacity: 0; }
        .dot span { position: relative; }
        .step { left: 462px; width: 1098px; height: 122px; overflow: hidden; }
        .st-name { position: absolute; left: 36px; top: 20px; font-family: "Mona Sans", sans-serif; font-stretch: 112%; font-weight: 600; font-size: 38px; color: #e6f7fd; }
        .st-det { position: absolute; left: 36px; top: 72px; font-family: "Mona Sans", sans-serif; font-weight: 400; font-size: 25px; color: #8ea7b2; }
        .st-det b { font-weight: 500; color: #c4dae3; }
        .st-right { position: absolute; right: 34px; top: 0; bottom: 0; display: flex; align-items: center; gap: 22px; }
        .pill { font-family: "Orbitron", sans-serif; font-weight: 600; font-size: 14px; letter-spacing: 0.16em; text-transform: uppercase;
          padding: 7px 14px 6px; border-radius: 999px; border: 1.5px solid rgba(var(--b), 0.55); background: rgba(var(--b), 0.14); color: rgb(var(--b)); }
        .r-m { --b: 98,191,245; }
        .chk { width: 40px; height: 40px; }
        .sweep { position: absolute; top: 0; bottom: 0; left: 0; width: 360px; opacity: 0;
          background: linear-gradient(100deg, rgba(92,214,245,0) 0%, rgba(168,236,251,0.20) 50%, rgba(92,214,245,0) 100%); }
        #en-s1 { top: 480px; } #en-d1 { top: 519px; }
        #en-s2 { top: 624px; } #en-d2 { top: 663px; }

        #en-fill { position: absolute; inset: 0; background: #0b1820; }
      </style>
      <div id="root" data-composition-id="f05-encadeia" data-width="1920" data-height="1080">
        <div id="en-bg" data-layout-ignore><div id="en-glow"></div><div id="en-grid"></div></div>

        <div id="en-world">
          <div id="en-head">
            <div class="mask"><div id="en-h1">Você pede.</div></div>
            <div id="en-h2">Ele <span class="k">encadeia</span> as ações.</div>
          </div>

          <div class="lab" id="en-l1"><i></i>VOCÊ PEDE</div>
          <div class="glass" id="en-panel">
            <div id="en-ph">
              <svg viewBox="0 0 26 26"><rect x="8.5" y="2" width="9" height="14" rx="4.5" fill="none" stroke="#5cd6f5" stroke-width="2" /><path d="M4.5 12.5 a8.5 8.5 0 0 0 17 0 M13 21 v3.5" fill="none" stroke="#5cd6f5" stroke-width="2" stroke-linecap="round" /></svg>
              <span id="en-state">OUVINDO</span>
            </div>
            <div id="en-bars" data-layout-ignore></div>
            <div id="en-req"><span class="w">“Quando</span> <span class="w">eu</span> <span class="w">chegar</span> <span class="w">em</span> <span class="w">casa,</span> <span class="w">acende</span> <span class="w">a</span> <span class="w">luz</span> <span class="w">da</span> <span class="w">sala.”</span></div>
          </div>

          <div class="lab" id="en-l2"><i></i>ELE ENCADEIA</div>
          <div id="en-spine" data-layout-ignore></div>
          <div class="dot" id="en-d1"><div class="f"></div><span>01</span></div>
          <div class="dot" id="en-d2"><div class="f"></div><span>02</span></div>
          <div class="glass step" id="en-s1">
            <div class="sweep" data-layout-ignore></div>
            <div class="st-name">criar rotina de lugar</div>
            <div class="st-det">Age sozinho <b class="trg">ao chegar em casa</b></div>
            <div class="st-right"><span class="pill r-m">Moderada</span>
              <svg class="chk" viewBox="0 0 40 40"><circle class="ck-c" cx="20" cy="20" r="18" fill="none" stroke="#5cd6f5" stroke-width="2" /><path class="ck-p" d="M12 20.5 L17.5 26 L28.5 14.5" fill="none" stroke="#e6f7fd" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" /></svg></div>
          </div>
          <div class="glass step" id="en-s2">
            <div class="sweep" data-layout-ignore></div>
            <div class="st-name">ligar dispositivo</div>
            <div class="st-det">Liga <b>a luz da sala</b></div>
            <div class="st-right"><span class="pill r-m">Moderada</span>
              <svg class="chk" viewBox="0 0 40 40"><circle class="ck-c" cx="20" cy="20" r="18" fill="none" stroke="#5cd6f5" stroke-width="2" /><path class="ck-p" d="M12 20.5 L17.5 26 L28.5 14.5" fill="none" stroke="#e6f7fd" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" /></svg></div>
          </div>
        </div>

        <div id="en-fill" data-layout-ignore></div>
      </div>
      <script>
        (function () {
          gsap.registerPlugin(DrawSVGPlugin);
          const tl = gsap.timeline({ paused: true });
          const J = window.JM;
          const F = JT.frame("f05");
          const L = (t) => t - F.start;
          const END = F.end - F.start;
          const tPede = L(JT.v("L08").start);
          const tEle = L(JT.word("L08", "Ele"));
          const tType = L(JT.marks.type_start), tTypeEnd = L(JT.marks.type_end);
          const tL9 = L(JT.v("L09").start);
          const t1 = L(JT.marks.step1_at), t2 = L(JT.marks.step2_at);
          const tQuando = L(JT.word("L09", "quando"));
          const tCasa = L(JT.word("L09", "casa"));
          const tBreath = L(JT.marks.breath_elo[0]);

          // ---------------------------------------------------------------- chegada: saímos de dentro do card
          tl.fromTo("#en-fill", { opacity: 1 }, { opacity: 0, duration: 0.65, ease: "power2.out" }, 0);
          tl.fromTo("#en-world", { scale: 1.06 }, { scale: 1, duration: 1.4, ease: "power3.out" }, 0);
          tl.fromTo("#en-glow", { opacity: 0.3 }, { opacity: 1, duration: 2.5, ease: "sine.inOut" }, 0.2);

          // ---------------------------------------------------------------- "Você pede. Ele encadeia as ações."
          J.maskReveal(tl, document.getElementById("en-h1"), tPede - 0.08, { dur: 0.9 });
          J.wordsIn(tl, document.getElementById("en-h2"), tEle - 0.06, { dur: 0.6, y: 18, blur: 10, stagger: 0.1 });
          tl.fromTo("#en-head", { y: 0, opacity: 1, filter: "blur(0px)" }, { y: -46, opacity: 0, filter: "blur(10px)", duration: 0.45, ease: "power2.in", immediateRender: false }, tType - 0.42);
          tl.set("#en-head", { visibility: "hidden" }, tType + 0.05);

          // ---------------------------------------------------------------- o pedido (voz → texto)
          const tPanel = tType - 0.2;
          tl.fromTo("#en-panel", { opacity: 0, y: 26, scale: 0.97, filter: "blur(8px)" }, { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 0.6, ease: "power3.out" }, tPanel);
          J.hudIn(tl, "#en-l1", tPanel + 0.12);
          tl.fromTo("#en-l1 i", { scaleX: 0, transformOrigin: "left center" }, { scaleX: 1, duration: 0.5, ease: "expo.out" }, tPanel + 0.12);
          // barras de voz (determinísticas) enquanto ouve
          const bars = document.getElementById("en-bars");
          const NB = 34;
          for (let k = 0; k < NB; k++) {
            const b = document.createElement("div");
            b.className = "vb";
            b.style.left = k * 9.7 + "px";
            bars.appendChild(b);
            const amp = 0.22 + 0.78 * Math.abs(Math.sin(k * 0.9 + 0.4) * Math.cos(k * 0.37));
            tl.fromTo(b, { scaleY: 0.12 }, { scaleY: amp, duration: 0.2, ease: "sine.inOut", yoyo: true, repeat: 9 }, tType - 0.1 + (k % 4) * 0.04);
            tl.fromTo(b, { opacity: 0.35 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, tPanel + 0.2);
          }
          tl.fromTo("#en-state", { opacity: 0.55 }, { opacity: 1, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 7 }, tType);
          // palavras chegam no ritmo da fala do usuário
          const words = gsap.utils.toArray("#en-req .w");
          const step = (tTypeEnd - tType) / words.length;
          words.forEach((w, k) => {
            tl.fromTo(w, { opacity: 0, y: 10, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.3, ease: "power3.out" }, tType + 0.06 + k * step);
          });
          // o cursor acompanha a última palavra que chegou
          words.forEach((w, k) => {
            const c = document.createElement("i");
            c.className = "cw";
            w.appendChild(c);
            const on = tType + 0.06 + k * step;
            tl.set(c, { opacity: 1 }, on);
            if (k < words.length - 1) tl.set(c, { opacity: 0 }, tType + 0.06 + (k + 1) * step);
            else {
              tl.fromTo(c, { opacity: 1 }, { opacity: 0, duration: 0.12, ease: "none", yoyo: true, repeat: 5, immediateRender: false }, tTypeEnd + 0.12);
              tl.set(c, { opacity: 0 }, tTypeEnd + 0.12 + 0.12 * 6);
            }
          });

          // ---------------------------------------------------------------- a cadeia: 2 funções reais, na ordem da fala
          J.hudIn(tl, "#en-l2", tL9 + 0.05);
          tl.fromTo("#en-l2 i", { scaleX: 0, transformOrigin: "left center" }, { scaleX: 1, duration: 0.5, ease: "expo.out" }, tL9 + 0.05);
          tl.fromTo("#en-spine", { scaleY: 0, transformOrigin: "50% 0%" }, { scaleY: 0.48, duration: 0.5, ease: "power2.out" }, tL9 + 0.1);
          [["#en-s1", "#en-d1"], ["#en-s2", "#en-d2"]].forEach(([s, d], k) => {
            const at = tL9 + 0.25 + k * 0.16;
            tl.fromTo(s, { opacity: 0, x: 30, filter: "blur(8px)" }, { opacity: 0.55, x: 0, filter: "blur(0px)", duration: 0.55, ease: "power3.out" }, at);
            tl.fromTo(d, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2)" }, at);
          });
          tl.fromTo("#en-spine", { scaleY: 0.48 }, { scaleY: 1, duration: 0.5, ease: "power2.inOut", immediateRender: false }, t2 - 0.5);
          // ativação: acende no verbo ("cria", "acende")
          [[t1, "#en-s1", "#en-d1"], [t2, "#en-s2", "#en-d2"]].forEach(([t, s, d]) => {
            tl.fromTo(s, { opacity: 0.55, borderColor: "rgba(92,214,245,0.20)" }, { opacity: 1, borderColor: "rgba(92,214,245,0.62)", duration: 0.3, ease: "power2.out", immediateRender: false }, t - 0.04);
            tl.fromTo(`${s} .sweep`, { opacity: 1, x: -380 }, { x: 1120, duration: 0.7, ease: "power2.inOut" }, t - 0.04);
            tl.fromTo(`${d} .f`, { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.2)" }, t - 0.04);
            tl.fromTo(`${d} span`, { color: "#8ea7b2" }, { color: "#04080c", duration: 0.2, ease: "none" }, t);
            tl.fromTo(`${s} .ck-c`, { drawSVG: "0%" }, { drawSVG: "100%", duration: 0.4, ease: "power2.out" }, t + 0.35);
            tl.fromTo(`${s} .ck-p`, { drawSVG: "0%" }, { drawSVG: "100%", duration: 0.28, ease: "power2.out" }, t + 0.6);
          });
          // "quando você chegar em casa" — o gatilho da rotina acende no texto
          tl.fromTo("#en-s1 .trg", { color: "#c4dae3" }, { color: "#5cd6f5", duration: 0.35, ease: "power2.out" }, tQuando);
          // confirmação: a cadeia inteira respira uma vez
          tl.fromTo(["#en-s1", "#en-s2"], { boxShadow: "0 40px 120px rgba(0,0,0,0.55), inset 0 1px 0 rgba(230,247,253,0.08), 0 0 0 rgba(92,214,245,0)" },
            { boxShadow: "0 40px 120px rgba(0,0,0,0.55), inset 0 1px 0 rgba(230,247,253,0.08), 0 0 42px rgba(92,214,245,0.28)", duration: 0.35, ease: "power2.out", yoyo: true, repeat: 1 }, tCasa);

          // ---------------------------------------------------------------- respiro antes do clímax
          tl.fromTo("#en-world", { scale: 1, opacity: 1, filter: "blur(0px)" }, { scale: 0.965, opacity: 0, filter: "blur(10px)", duration: 0.7, ease: "power2.in", immediateRender: false }, tBreath - 0.25);
          tl.fromTo("#en-glow", { opacity: 1 }, { opacity: 0, duration: 0.7, ease: "power2.in", immediateRender: false }, tBreath - 0.25);
          window.__timelines["f05-encadeia"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
